name: Temporary binary review fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/binary-vote-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@v6
        with:
          ref: agent/binary-vote-runtime

      - name: Detect whether fixes are needed
        id: state
        shell: bash
        run: |
          if grep -q "verifyBinaryVotePayload" src/lib/data/binary-vote-format.ts && grep -q "TemporaryDirectory" scripts/export_vote_binary.py; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply review fixes
        if: steps.state.outputs.needed == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {text.count(old)}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Browser-side SHA-256 verification before decoding.
          replace_once(
              "src/lib/data/binary-vote-format.ts",
              """function isSha256(value: unknown): value is string {\n  return typeof value === 'string' && /^[a-f0-9]{64}$/.test(value)\n}\n""",
              """function isSha256(value: unknown): value is string {\n  return typeof value === 'string' && /^[a-f0-9]{64}$/.test(value)\n}\n\nexport async function verifyBinaryVotePayload(\n  buffer: ArrayBuffer,\n  metadata: VoteBinaryFileMetadata,\n  fileName = metadata.file,\n): Promise<void> {\n  const subtle = globalThis.crypto?.subtle\n  if (subtle === undefined) {\n    throw new Error(`${fileName} cannot be verified because SHA-256 is unavailable.`)\n  }\n\n  const digest = await subtle.digest('SHA-256', buffer)\n  const actualSha256 = Array.from(new Uint8Array(digest), (byte) =>\n    byte.toString(16).padStart(2, '0'),\n  ).join('')\n\n  if (actualSha256 !== metadata.binarySha256) {\n    throw new Error(`${fileName} does not match its manifest SHA-256.`)\n  }\n}\n""",
          )

          replace_once(
              "src/data/loaders.ts",
              """  decodeBinaryVoteEntries,\n  parseVoteDataManifest,\n  type VoteBinaryFileMetadata,\n""",
              """  decodeBinaryVoteEntries,\n  parseVoteDataManifest,\n  verifyBinaryVotePayload,\n  type VoteBinaryFileMetadata,\n""",
          )
          replace_once(
              "src/data/loaders.ts",
              """function decodeVoteFile(\n  buffer: ArrayBuffer,\n  metadata: VoteBinaryFileMetadata,\n  expectedVoteType: VoteType,\n  fileName: string,\n): VoteEntry[] {\n""",
              """async function decodeVoteFile(\n  buffer: ArrayBuffer,\n  metadata: VoteBinaryFileMetadata,\n  expectedVoteType: VoteType,\n  fileName: string,\n): Promise<VoteEntry[]> {\n""",
          )
          replace_once(
              "src/data/loaders.ts",
              """  try {\n    return decodeBinaryVoteEntries(\n""",
              """  try {\n    await verifyBinaryVotePayload(buffer, metadata, fileName)\n    return decodeBinaryVoteEntries(\n""",
          )
          loader_path = Path("src/data/loaders.ts")
          loader_text = loader_path.read_text(encoding="utf-8")
          start = loader_text.index("  const firstVotes = decodeVoteFile(")
          end = loader_text.index("\n\n  if (!isGermanyStatesGeoJson", start)
          replacement = """  const [firstVotes, secondVotes] = await Promise.all([\n    decodeVoteFile(\n      firstVotesBinary,\n      voteManifest.files.firstVotes,\n      '1',\n      files.firstVotes,\n    ),\n    decodeVoteFile(\n      secondVotesBinary,\n      voteManifest.files.secondVotes,\n      '2',\n      files.secondVotes,\n    ),\n  ])"""
          loader_path.write_text(loader_text[:start] + replacement + loader_text[end:], encoding="utf-8")

          # Unit coverage for payload integrity verification.
          replace_once(
              "tests/unit/binary-vote-format.test.ts",
              """import assert from 'node:assert/strict'\nimport { test } from 'node:test'\n""",
              """import assert from 'node:assert/strict'\nimport { createHash } from 'node:crypto'\nimport { test } from 'node:test'\n""",
          )
          replace_once(
              "tests/unit/binary-vote-format.test.ts",
              """  decodeBinaryVoteEntries,\n  parseVoteDataManifest,\n  type VoteBinaryFileMetadata,\n""",
              """  decodeBinaryVoteEntries,\n  parseVoteDataManifest,\n  verifyBinaryVotePayload,\n  type VoteBinaryFileMetadata,\n""",
          )
          replace_once(
              "tests/unit/binary-vote-format.test.ts",
              """const SHA = '0'.repeat(64)\n""",
              """const SHA = '0'.repeat(64)\n\nfunction sha256(buffer: ArrayBuffer): string {\n  return createHash('sha256').update(new Uint8Array(buffer)).digest('hex')\n}\n""",
          )
          replace_once(
              "tests/unit/binary-vote-format.test.ts",
              """test('rejects an invalid binary signature', () => {\n""",
              """test('verifies the binary payload against the manifest SHA-256', async () => {\n  const { buffer, metadata } = buildBinaryFixture()\n  metadata.binarySha256 = sha256(buffer)\n\n  await assert.doesNotReject(() =>\n    verifyBinaryVotePayload(buffer, metadata, 'second_votes.bin'),\n  )\n\n  new Uint8Array(buffer)[buffer.byteLength - 1] ^= 0xff\n  await assert.rejects(\n    () => verifyBinaryVotePayload(buffer, metadata, 'second_votes.bin'),\n    /does not match its manifest SHA-256/,\n  )\n})\n\ntest('rejects an invalid binary signature', () => {\n""",
          )

          # Stage both binaries and the manifest, then publish only after cross-file validation succeeds.
          replace_once(
              "scripts/export_vote_binary.py",
              """import struct\nfrom typing import Any\n""",
              """import struct\nfrom tempfile import TemporaryDirectory\nfrom typing import Any\n""",
          )
          exporter_path = Path("scripts/export_vote_binary.py")
          exporter_text = exporter_path.read_text(encoding="utf-8")
          start = exporter_text.index("    first_metadata = export_vote_file(", exporter_text.index("def export_election_directory"))
          end = exporter_text.index("\n\n\ndef _parse_args", start)
          replacement = '''    output_directory.mkdir(parents=True, exist_ok=True)\n    with TemporaryDirectory(\n        prefix=".vote-export-",\n        dir=output_directory,\n    ) as temporary_directory:\n        staging_directory = Path(temporary_directory)\n        first_metadata = export_vote_file(\n            first_source,\n            staging_directory / "first_votes.bin",\n            "1",\n        )\n        second_metadata = export_vote_file(\n            second_source,\n            staging_directory / "second_votes.bin",\n            "2",\n        )\n\n        first_districts = {\n            index: state\n            for index, state in enumerate(first_metadata.districtStates)\n            if state is not None\n        }\n        second_districts = {\n            index: state\n            for index, state in enumerate(second_metadata.districtStates)\n            if state is not None\n        }\n        if first_districts != second_districts:\n            raise ValueError(\n                f"{source_directory}: first- and second-vote files do not have identical "\n                "constituency-to-state coverage"\n            )\n\n        manifest = {\n            "schemaVersion": SCHEMA_VERSION,\n            "format": FORMAT_NAME,\n            "genders": list(GENDERS),\n            "ageGroups": list(AGE_GROUPS),\n            "electionMethods": list(ELECTION_METHODS),\n            "files": {\n                "firstVotes": first_metadata.to_json(),\n                "secondVotes": second_metadata.to_json(),\n            },\n        }\n        manifest_path = staging_directory / "vote_data.json"\n        manifest_path.write_text(\n            json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n",\n            encoding="utf-8",\n        )\n\n        for file_name in ("first_votes.bin", "second_votes.bin", "vote_data.json"):\n            (staging_directory / file_name).replace(output_directory / file_name)\n\n    return manifest'''
          exporter_path.write_text(exporter_text[:start] + replacement + exporter_text[end:], encoding="utf-8")

          # Regression coverage: failed cross-file validation must preserve the previous runtime set.
          test_path = Path("scripts/tests/test_vote_binary_export.py")
          test_text = test_path.read_text(encoding="utf-8")
          method_start = test_text.index("    def test_rejects_different_district_state_coverage(self) -> None:")
          method_end = test_text.index("\n\n\nif __name__", method_start)
          replacement = '''    def test_rejects_different_district_state_coverage(self) -> None:\n        with tempfile.TemporaryDirectory() as temporary_directory:\n            root = Path(temporary_directory)\n            source_directory = root / "generated" / "btw2025"\n            output_directory = root / "public" / "data" / "btw2025"\n            source_directory.mkdir(parents=True)\n            output_directory.mkdir(parents=True)\n            common = {\n                "districtId": 1,\n                "gender": "m",\n                "ageGroup": "18-24",\n                "party": "AAA",\n                "electionMethod": "postal",\n                "votes": 1.0,\n            }\n            (source_directory / "first_votes.json").write_text(\n                json.dumps([{**common, "state": "State A", "voteType": "1"}]),\n                encoding="utf-8",\n            )\n            (source_directory / "second_votes.json").write_text(\n                json.dumps([{**common, "state": "State B", "voteType": "2"}]),\n                encoding="utf-8",\n            )\n\n            previous_outputs = {\n                "first_votes.bin": b"previous first votes",\n                "second_votes.bin": b"previous second votes",\n                "vote_data.json": b"{\\\"previous\\\":true}\\n",\n            }\n            for file_name, content in previous_outputs.items():\n                (output_directory / file_name).write_bytes(content)\n\n            with self.assertRaisesRegex(ValueError, "constituency-to-state coverage"):\n                export_election_directory(source_directory, output_directory)\n\n            for file_name, content in previous_outputs.items():\n                self.assertEqual((output_directory / file_name).read_bytes(), content)'''
          test_path.write_text(test_text[:method_start] + replacement + test_text[method_end:], encoding="utf-8")
          PY

      - name: Set up Node.js
        if: steps.state.outputs.needed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.state.outputs.needed == 'true'
        run: npm ci

      - name: Test exporter
        if: steps.state.outputs.needed == 'true'
        run: python3 -m unittest scripts.tests.test_vote_binary_export

      - name: Test application
        if: steps.state.outputs.needed == 'true'
        run: npm test

      - name: Lint application
        if: steps.state.outputs.needed == 'true'
        run: npm run lint

      - name: Build application
        if: steps.state.outputs.needed == 'true'
        run: npm run build

      - name: Commit review fixes
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git add \
            src/lib/data/binary-vote-format.ts \
            src/data/loaders.ts \
            tests/unit/binary-vote-format.test.ts \
            scripts/export_vote_binary.py \
            scripts/tests/test_vote_binary_export.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Address binary data review feedback"
          git push origin HEAD:agent/binary-vote-runtime
