name: app-v2 CI

on:
  pull_request:
    paths:
      - 'app-v2/**'
      - '.github/workflows/app-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app-v2
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: app-v2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Lint application
        run: npm run lint

      - name: Build application
        run: npm run build
