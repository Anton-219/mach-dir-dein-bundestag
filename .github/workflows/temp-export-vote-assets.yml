name: Temporary election data workflow validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/binary-vote-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/binary-vote-runtime

      - name: Update data preparation documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/README.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "scripts/data/generated/first_votes.json\nscripts/data/generated/second_votes.json",
              "scripts/data/generated/btw2021/first_votes.json\nscripts/data/generated/btw2021/second_votes.json",
          )
          text = text.replace(
              'OUTPUT_DIRECTORY = ROOT / "scripts/data/generated"',
              'OUTPUT_DIRECTORY = ROOT / "scripts/data/generated/btw2021"',
          )

          marker = "## Running the complete local preparation"
          if marker not in text:
              insertion_point = "The Python modules in `scripts/election_data/` contain the reusable operations called by those notebook cells. They are deliberately kept out of the foreground so that the preparation process remains readable in the notebooks rather than becoming one opaque pipeline call.\n"
              section = """

## Running the complete local preparation

Election-data preparation is intentionally separate from frontend development and builds. Download the official source files and place them under `scripts/data/` at the paths expected by the notebooks:

```text
scripts/data/btw21_wbz_ergebnisse.csv
scripts/data/btw21_rws_bst2.csv
scripts/data/btw25_wbz_ergebnisse.csv
scripts/data/btw25_rws_bst2.csv
```

Then run the complete notebook, validation and binary-export workflow explicitly:

```bash
npm run prepare:election-data
```

The two stages can also be run separately:

```bash
npm run prepare:vote-json
npm run prepare:vote-data
```

The notebooks write gitignored human-readable data to `scripts/data/generated/btw2021/` and `scripts/data/generated/btw2025/`. The binary exporter converts those files into the committed runtime assets under `public/data/btw2021/` and `public/data/btw2025/`.
"""
              if insertion_point not in text:
                  raise RuntimeError("Could not find scripts/README.md insertion point")
              text = text.replace(insertion_point, insertion_point + section, 1)

          path.write_text(text, encoding="utf-8")

          notebook_path = Path("scripts/notebooks/btw2025/02_validate_btw2025_vote_entries.ipynb")
          notebook_text = notebook_path.read_text(encoding="utf-8")
          notebook_text = notebook_text.replace(
              "the permitted 2025 age-group values are election-specific.",
              "the permitted age-group values use the shared application categories.",
          )
          notebook_path.write_text(notebook_text, encoding="utf-8")
          PY

      - name: Validate exporter and command scripts
        run: |
          python3 -m unittest scripts.tests.test_vote_binary_export
          node --check scripts/run-election-notebooks.mjs
          node --check scripts/run-vote-binary-export.mjs

      - name: Commit documentation adjustments
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git add scripts/README.md scripts/notebooks/btw2025/02_validate_btw2025_vote_entries.ipynb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Document explicit election data preparation"
          git push origin HEAD:agent/binary-vote-runtime
